<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141414"><title>Dragon Dungeon · Prototype</title><link rel="stylesheet" href="style.css?v=830f4095e72a"></head><body>
<header><a class="brand" href="./">DRAGON DUNGEON</a><span class="tag">ENCOUNTER ROOMS / 12</span></header>
<main class="console"><section class="viewport frame" aria-label="Dungeon view"><div id="scene" class="scene"></div><div class="hud"><span id="direction"></span><span id="health" aria-label="Health"></span></div></section>
<section class="cartography frame" aria-label="Explored dungeon"><div id="live-map"></div><div class="map-status"><span>EXPLORED AREA</span><span>▲ YOU</span></div></section>
<section class="narrative frame" aria-label="Story and choices"><div class="caption"><span id="location"></span></div><p id="message" role="status"></p><dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><p class="eyebrow" id="modal-label"></p><button id="close" aria-label="Close panel">✕</button></div><h2 id="modal-title"></h2><div id="modal-body"></div></dialog><button id="interact" hidden>Interact</button></section>
<aside class="command frame" aria-label="Controls and menus"><div id="encounter-controls" hidden aria-label="Encounter actions"></div><div class="control-area"><div class="controls"><button data-action="forward" aria-label="Move forward">↑<small>FORWARD</small></button><div><button data-action="left" aria-label="Turn left">↶<small>TURN LEFT</small></button><button data-action="back" aria-label="Step backward">↓<small>BACK</small></button><button data-action="right" aria-label="Turn right">↷<small>TURN RIGHT</small></button></div></div><p class="muted">Arrow keys move and turn.<br>Down steps backward.</p></div><div class="toolbar"><button id="journal">Journal <kbd>J</kbd></button><button id="map">Map key <kbd>M</kbd></button><button id="dragon-return" hidden>Return to dragon</button><button id="earned-name" hidden>Earned name</button><button class="quiet" id="reset">New game</button></div><div class="save"><span class="dot"></span><span id="storage"></span></div></aside></main><footer>LOCAL PROTOTYPE · Full maze adventure · Guardians placed · Final book name still a placeholder</footer><script type="module" src="app.js?v=830f4095e72a"></script></body></html>
