<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141414"><title>Dungeon of the Nameless Dragon</title><link rel="stylesheet" href="style.css?v=6d789c038015"><link rel="stylesheet" href="iron-brass.css?v=6d789c038015"><link rel="stylesheet" href="opening-scene.css?v=6d789c038015"></head><body class="title-open dungeon-ui">
<section id="title-screen" aria-label="Dungeon of the Nameless Dragon title screen">
<div class="title-stage"><canvas id="title-art" width="480" height="360" role="img" aria-label="Dungeon of the Nameless Dragon. Torchlit stone arches lead toward green dragon eyes in the darkness."></canvas>
<div class="title-entry"><button id="title-enter">Enter the Dungeon</button><p id="title-status" role="status">Press Space Bar or select to begin</p></div></div>
</section>
<header><a class="brand" href="./">DRAGON DUNGEON</a><span class="tag">ENCOUNTER ROOMS / 12</span></header>
<main class="console"><section class="viewport frame" aria-label="Dungeon view"><div id="scene" class="scene"></div><div class="hud"><span id="direction"></span><span id="health" aria-label="Health"></span></div></section>
<section class="cartography frame" aria-label="Explored dungeon"><div id="live-map"></div><div class="map-status"><span>EXPLORED AREA</span><span>▲ YOU</span></div></section>
<section class="narrative frame" aria-label="Story and choices"><p id="message" role="status"></p><dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><p class="eyebrow" id="modal-label"></p><button id="close" aria-label="Close panel">✕</button></div><h2 id="modal-title"></h2><div id="modal-body"></div></dialog></section>
<aside class="command frame" aria-label="Controls and menus"><div id="encounter-controls" hidden aria-label="Encounter actions"></div><div class="control-area">
  <div class="movement-pad" aria-label="Movement and interaction">
    <button type="button" data-action="forward" aria-label="Move forward"><span class="pad-arrow" aria-hidden="true"></span></button>
    <button type="button" data-action="left" aria-label="Turn left"><span class="pad-arrow" aria-hidden="true"></span></button>
    <button type="button" id="space-action" aria-label="Interact">Space Bar</button>
    <button type="button" data-action="right" aria-label="Turn right"><span class="pad-arrow" aria-hidden="true"></span></button>
    <button type="button" data-action="back" aria-label="Step backward"><span class="pad-arrow" aria-hidden="true"></span></button>
  </div>
</div>
<div class="toolbar">
  <button type="button" id="journal">Journal</button>
  <button type="button" id="dungeon-music-toggle" aria-pressed="false">Sound On</button>
  <button type="button" id="reset">New Game</button>
  <button type="button" id="dragon-return" hidden>Return to dragon</button>
  <button type="button" id="earned-name" hidden>Earned name</button>
</div><div class="save" role="status" hidden><span class="dot"></span><span id="storage"></span></div></aside></main><div id="door-fade" hidden aria-hidden="true"></div><footer>LOCAL PROTOTYPE · Full maze adventure · Guardians placed · Dragon name reveal</footer><script type="module" src="boot.js?v=6d789c038015"></script></body></html>
